name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # ================= 编译并发布全平台二进制包 =================
  build-and-release-binaries:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar

      - name: Set Release Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist/packages

          VERSION="${{ env.VERSION }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # -------------------------------------------------------------
          # 1. 编译 Node Agent (纯 Go 静态编译，支持全平台全架构)
          # -------------------------------------------------------------
          echo "===> Compiling librespeed-node binaries..."

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_linux_amd64 ./cmd/node
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_linux_arm64 ./cmd/node
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_linux_armv7 ./cmd/node
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_linux_386 ./cmd/node
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_linux_riscv64 ./cmd/node

          # Darwin (macOS)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_darwin_amd64 ./cmd/node
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_darwin_arm64 ./cmd/node

          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_windows_amd64.exe ./cmd/node
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_windows_arm64.exe ./cmd/node
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_windows_386.exe ./cmd/node

          # FreeBSD
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_freebsd_amd64 ./cmd/node
          CGO_ENABLED=0 GOOS=freebsd GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-node_freebsd_arm64 ./cmd/node

          # -------------------------------------------------------------
          # 2. 编译 Web 中心服务 (标准 SQLite 引擎，纯 Go 静态编译)
          # -------------------------------------------------------------
          echo "===> Compiling librespeed-web binaries..."

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_linux_amd64 ./cmd/web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_linux_arm64 ./cmd/web
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_linux_armv7 ./cmd/web
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_linux_386 ./cmd/web
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_linux_riscv64 ./cmd/web

          # Darwin (macOS)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_darwin_amd64 ./cmd/web
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_darwin_arm64 ./cmd/web

          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_windows_amd64.exe ./cmd/web
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_windows_arm64.exe ./cmd/web

          # FreeBSD
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/librespeed-web_freebsd_amd64 ./cmd/web

          # -------------------------------------------------------------
          # 3. 打包发布归档 (.tar.gz / .zip)
          # -------------------------------------------------------------
          echo "===> Packaging release archives..."

          # 打包 Node Agent 归档 (Linux / Darwin / FreeBSD)
          for os in linux darwin freebsd; do
            for arch in amd64 arm64 armv7 386 riscv64; do
              bin="dist/librespeed-node_${os}_${arch}"
              if [ -f "$bin" ]; then
                pkg_dir="dist/tmp_node_${os}_${arch}"
                mkdir -p "$pkg_dir"
                cp "$bin" "$pkg_dir/librespeed-node"
                cp README.md .env.example "$pkg_dir/"
                tar -czf "dist/packages/librespeed-node_${VERSION}_${os}_${arch}.tar.gz" -C "$pkg_dir" .
                rm -rf "$pkg_dir"
              fi
            done
          done

          # 打包 Windows Node Agent 归档
          for arch in amd64 arm64 386; do
            bin="dist/librespeed-node_windows_${arch}.exe"
            if [ -f "$bin" ]; then
              pkg_dir="dist/tmp_node_win_${arch}"
              mkdir -p "$pkg_dir"
              cp "$bin" "$pkg_dir/librespeed-node.exe"
              cp README.md .env.example "$pkg_dir/"
              (cd "$pkg_dir" && zip -q -r "../../dist/packages/librespeed-node_${VERSION}_windows_${arch}.zip" .)
              rm -rf "$pkg_dir"
            fi
          done

          # 打包 Web 中心服务归档 (Linux / Darwin / FreeBSD)
          for os in linux darwin freebsd; do
            for arch in amd64 arm64 armv7 386 riscv64; do
              bin="dist/librespeed-web_${os}_${arch}"
              if [ -f "$bin" ]; then
                pkg_dir="dist/tmp_web_${os}_${arch}"
                mkdir -p "$pkg_dir"
                cp "$bin" "$pkg_dir/librespeed-web"
                cp -r static "$pkg_dir/"
                cp README.md .env.example "$pkg_dir/"
                tar -czf "dist/packages/librespeed-web_${VERSION}_${os}_${arch}.tar.gz" -C "$pkg_dir" .
                rm -rf "$pkg_dir"
              fi
            done
          done

          # 打包 Windows Web 中心服务归档
          for arch in amd64 arm64; do
            bin="dist/librespeed-web_windows_${arch}.exe"
            if [ -f "$bin" ]; then
              pkg_dir="dist/tmp_web_win_${arch}"
              mkdir -p "$pkg_dir"
              cp "$bin" "$pkg_dir/librespeed-web.exe"
              cp -r static "$pkg_dir/"
              cp README.md .env.example "$pkg_dir/"
              (cd "$pkg_dir" && zip -q -r "../../dist/packages/librespeed-web_${VERSION}_windows_${arch}.zip" .)
              rm -rf "$pkg_dir"
            fi
          done

          # -------------------------------------------------------------
          # 4. 生成 SHA256 校验和文件
          # -------------------------------------------------------------
          echo "===> Generating SHA256 checksums..."
          (cd dist/packages && sha256sum * > checksums.txt)

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          files: |
            dist/packages/*
          draft: false
          prerelease: false
          generate_release_notes: true

  # ================= 构建并推送多架构 Docker 镜像 =================
  docker-publish:
    name: Build & Push Multi-Arch Docker Images (amd64 / arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Web Image Metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/librespeed-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build & Push Web Image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Node Image Metadata
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/librespeed-node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build & Push Node Image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
